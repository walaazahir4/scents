<nav class="fixed top-0 left-0 z-100 w-full bg-white shadow-sm">
  <div class="mx-auto flex h-20 items-center justify-between px-4 sm:px-6 lg:px-8">

    <!-- Logo -->
    <img
      src="/images/logo2.png"
      alt="Logo"
      class="h-12 w-32 object-contain sm:h-14 sm:w-36 lg:h-15 lg:w-40"
    />

    <!-- Desktop Navigation -->
    <div class="hidden items-center gap-5 lg:flex xl:gap-8">

      <a
        href="#home"
        (click)="setActive('home')"
        class="nav-anchor text-base font-bold transition sm:text-lg xl:text-[20px]"
        [class.text-[#8F6A77]]="activeSection() === 'home'"
        [class.text-black]="activeSection() !== 'home'"
      >
        Home
      </a>

      <a
        href="#boutique"
        (click)="setActive('boutique')"
        class="nav-anchor text-base font-bold transition sm:text-lg xl:text-[20px]"
        [class.text-[#8F6A77]]="activeSection() === 'boutique'"
        [class.text-black]="activeSection() !== 'boutique'"
      >
        Boutique
      </a>

      <a
        href="#occasions"
        (click)="setActive('occasions')"
        class="nav-anchor text-base font-bold transition sm:text-lg xl:text-[20px]"
        [class.text-[#8F6A77]]="activeSection() === 'occasions'"
        [class.text-black]="activeSection() !== 'occasions'"
      >
        Occasions
      </a>

      <a
        href="#about"
        (click)="setActive('about')"
        class="nav-anchor text-base font-bold transition sm:text-lg xl:text-[20px]"
        [class.text-[#8F6A77]]="activeSection() === 'about'"
        [class.text-black]="activeSection() !== 'about'"
      >
        About
      </a>

      <a
        href="#contact"
        (click)="setActive('contact')"
        class="nav-anchor text-base font-bold transition sm:text-lg xl:text-[20px]"
        [class.text-[#8F6A77]]="activeSection() === 'contact'"
        [class.text-black]="activeSection() !== 'contact'"
      >
        Contact
      </a>

    </div>

    <!-- Desktop Buttons -->
    <div class="hidden items-center justify-end gap-2 lg:flex xl:gap-3">

      <scents-button
        [variant]="'without'"
        [text]="'SIGN UP'"
      ></scents-button>

      <div class="w-32 xl:w-45">
        <scents-button></scents-button>
      </div>

    </div>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-lg text-2xl text-black lg:hidden"
      (click)="isMenuOpen.set(!isMenuOpen())"
      aria-label="Toggle menu"
    >
      <i class="pi pi-align-justify"></i>
    </button>

  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
    <div class="border-t border-gray-100 bg-white px-5 py-5 shadow-md lg:hidden">

      <div class="flex flex-col gap-5">

        <a
          href="#home"
          (click)="setActive('home'); isMenuOpen.set(false)"
          class="text-lg font-bold transition"
          [class.text-[#8F6A77]]="activeSection() === 'home'"
          [class.text-black]="activeSection() !== 'home'"
        >
          Home
        </a>

        <a
          href="#boutique"
          (click)="setActive('boutique'); isMenuOpen.set(false)"
          class="text-lg font-bold transition"
          [class.text-[#8F6A77]]="activeSection() === 'boutique'"
          [class.text-black]="activeSection() !== 'boutique'"
        >
          Boutique
        </a>

        <a
          href="#occasions"
          (click)="setActive('occasions'); isMenuOpen.set(false)"
          class="text-lg font-bold transition"
          [class.text-[#8F6A77]]="activeSection() === 'occasions'"
          [class.text-black]="activeSection() !== 'occasions'"
        >
          Occasions
        </a>

        <a
          href="#about"
          (click)="setActive('about'); isMenuOpen.set(false)"
          class="text-lg font-bold transition"
          [class.text-[#8F6A77]]="activeSection() === 'about'"
          [class.text-black]="activeSection() !== 'about'"
        >
          About
        </a>

        <a
          href="#contact"
          (click)="setActive('contact'); isMenuOpen.set(false)"
          class="text-lg font-bold transition"
          [class.text-[#8F6A77]]="activeSection() === 'contact'"
          [class.text-black]="activeSection() !== 'contact'"
        >
          Contact
        </a>

        <!-- Mobile Buttons -->
        <div class="mt-2 flex flex-col gap-3 border-t border-gray-100 pt-4 sm:flex-row">

          <scents-button
            [variant]="'without'"
            [text]="'SIGN UP'"
          ></scents-button>

          <div class="w-full sm:w-40">
            <scents-button></scents-button>
          </div>

        </div>

      </div>

    </div>
  }

</nav>
