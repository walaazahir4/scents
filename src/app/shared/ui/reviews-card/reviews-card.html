<div class="flex gap-1">
<i class="pi pi-star-fill text-[#F9D802]! text-[22px]"></i>
<i class="pi pi-star-fill text-[#F9D802]! text-[22px]"></i>
<i class="pi pi-star-fill text-[#F9D802]! text-[22px]"></i>
<i class="pi pi-star-fill text-[#F9D802]! text-[22px]"></i>
