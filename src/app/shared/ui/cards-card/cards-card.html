<button class="bg-[#F8C8D64D] py-6 px-8 flex hover:bg-[#F8C8D699] cards-card flex-col gap-5.75 rounded-tl-[100px] rounded-tr-[20px] rounded-br-[100px] rounded-bl-4xl">
    <div class="w-79 h-52 rounded-tl-[100px] rounded-tr-[20px] rounded-br-[100px] rounded-bl-[20px]  overflow-hidden">
        <img [src]="img()" alt="roses pic" class="w-full h-full object-cover">
    </div>

    <div class="w-full flex text-start flex-col gap-3 max-w-79">
        <p class="text-[24px] font-bold">
            {{title()}}
        </p>
        <p class="text-[20px]">
            {{desc()}}
        </p>
    </div>

    <div class="flex justify-between items-center">
       <div class="w-full max-w-52.75">
         <scents-button [text]="'ADD TO CARD'"></scents-button>
        </div>
        <P class="font-bold text-[20px] text-[#9E7E89] pr-3">
            {{price()}}
        </P>
    </div>
</button>
