<div id="home">
    <div class="w-full h-screen relative flex justify-center items-center">
        <img src="/images/home.jpg" alt="home-pic" class="absolute object-cover w-full h-full">
        <div class="text-black absolute z-50 flex flex-col gap-3 justify-center items-center w-full max-w-190">
            <p class="font-bold text-[36px] lg:text-[44px]">
                {{'home.title' | translate}}
            </p>
            <p class="text-[19px] p-2 lg:p-0 lg:text-[24px] text-center">
                {{'home.subtitle' | translate}}
            </p>
            <scents-button class="w-full max-w-[320px]" [text]="'home.btn' | translate"></scents-button>
        </div>

    </div>
</div>
