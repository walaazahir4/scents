<div class="p-5 lg:py-20 lg:px-24 flex flex-col gap-6" id="contact">
    <p class="font-bold text-[36px] lg:text-[44px] text-center text-nowrap">
        Our customer say
    </p>

    <div class="flex flex-col lg:flex-row justify-between gap-5 items-center">
        @for(review of reviews; track $index){
            <scents-reviews-card [img]="review.img" 
                                 [name]="review.name" 
                                 [desc]="review.desc"></scents-reviews-card>
        }
    </div>
</div>

<div class="p-5 lg:py-20 lg:px-24 flex flex-col gap-6">
    <p class="font-bold text-[36px] lg:text-[44px] text-center text-nowrap">
        Delivery & services
    </p>

    <div class="flex flex-col lg:flex-row items-center lg:justify-between lg:items-stretch gap-6">
        @for(service of services; track $index){
            <scents-service-cards [icon]="service.icon"
                                  [title]="service.title"
                                  [desc]="service.desc"></scents-service-cards>
        }
    </div>
</div>
